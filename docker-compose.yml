services:
  # ===========================================================================
  # 1. ПРОДАКШЕН ВЕРСИЯ (По умолчанию: docker compose up -d --build)
  # - Скомпилированный оптимизированный фронтенд в dist/
  # - Express-сервер с кэшированием танков, API-прокси и ретро-играми
  # - Минимальный легковесный образ без dev-зависимостей
  # ===========================================================================
  prod:
    build:
      context: .
      target: prod
    container_name: vanya-dr-prod
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  # ===========================================================================
  # 2. РАЗРАБОТКА И ТЕСТЫ (Запуск: docker compose --profile dev up)
  # - Поддерживает горячую перезагрузку (Vite HMR + tsx watch)
  # - Изменения в файлах на хосте мгновенно обновляются в браузере
  # ===========================================================================
  dev:
    build:
      context: .
      target: dev
    container_name: vanya-dr-dev
    ports:
      - "3000:3000"
    volumes:
      # Пробрасываем проект для живого обновления кода
      - .:/app
      # Изолируем node_modules контейнера от хоста
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    profiles:
      - dev
